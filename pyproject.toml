[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-review-agent"
version = "0.1.0.dev0"
description = "A case-neutral, evidence-grounded research review workflow controller."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf==6.20.1"]

[project.scripts]
rragent = "research_review_agent.cli:main"

[tool.setuptools.packages.find]
include = ["research_review_agent*", "workflow*"]

[tool.setuptools.package-data]
research_review_agent = ["resources/*.json"]
workflow = ["phases.json", "procedures/*.md"]

